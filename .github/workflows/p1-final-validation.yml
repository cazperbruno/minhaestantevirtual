# Multiplatform smoke already passed on run 34296789502.
# This second pass revalidates quality after restoring the last build-valid lint baseline.
name: P1 final quality recheck

on:
  push:
    branches:
      - readify/p1-auth-runtime-01
    paths:
      - .github/workflows/p1-final-validation.yml

permissions:
  contents: read

jobs:
  quality:
    name: P1 quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/p1-auth-runtime-01

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce lint ratchet
        run: |
          bunx eslint . --format json --output-file lint-report.json || true
          bun scripts/check-lint-budget.mjs lint-report.json quality/lint-baseline.json

      - name: Run unit and architecture tests
        run: bun run test

      - name: Validate public build configuration
        run: |
          test -s .env
          grep -q '^VITE_SUPABASE_URL=' .env
          grep -q '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env
          grep -q '^VITE_SUPABASE_PROJECT_ID=' .env

      - name: Production build
        run: bun run build
