name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs duplicados na mesma branch/PR — economiza minutos do GitHub Actions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Cache do diretório global de pacotes do Bun + node_modules.
      # Chave principal = hash do bun.lock → invalida quando deps mudam.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # O legado ainda possui dívida de lint conhecida. Em vez de mascarar o
      # exit code, o CI mede a dívida e bloqueia qualquer regressão. O baseline
      # deve ser reduzido toda vez que uma onda de limpeza eliminar problemas.
      - name: Generate ESLint report
        run: bunx eslint . --format json --output-file lint-report.json || true

      - name: Enforce lint debt budget
        run: bun scripts/check-lint-budget.mjs lint-report.json quality/lint-baseline.json

      - name: Run tests
        run: bun run test

      # Cache do build do Vite — acelera transforms/optimizeDeps em runs subsequentes.
      - name: Cache Vite build
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('vite.config.ts', 'tsconfig*.json', 'tailwind.config.ts', 'postcss.config.js', 'package.json') }}-${{ hashFiles('src/**/*.{ts,tsx,css}', 'index.html') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('vite.config.ts', 'tsconfig*.json', 'tailwind.config.ts', 'postcss.config.js', 'package.json') }}-
            ${{ runner.os }}-vite-

      - name: Build (smoke check)
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
