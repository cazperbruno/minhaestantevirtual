# Trigger v8: preserve JSX grouping by replacing page-owned AppShell wrappers with fragments.
name: P1 consolidate page shells

on:
  push:
    branches:
      - readify/p1-auth-runtime-01
    paths:
      - .github/workflows/p1-consolidate-page-shells.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/p1-auth-runtime-01
          fetch-depth: 0

      - name: Replace page-owned AppShell wrappers with fragments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = Path('src/pages')
          changed = []
          for path in sorted(pages.glob('*.tsx')):
              text = path.read_text(encoding='utf-8')
              if 'AppShell' not in text:
                  continue

              imports = re.findall(r'^import\s+\{\s*AppShell\s*\}\s+from\s+["\']@/components/layout/AppShell["\'];\s*$', text, flags=re.M)
              if len(imports) != 1:
                  raise SystemExit(f'{path}: expected one canonical AppShell import, got {len(imports)}')

              opens = text.count('<AppShell>')
              closes = text.count('</AppShell>')
              if opens < 1 or opens != closes or opens > 6:
                  raise SystemExit(f'{path}: suspicious AppShell wrappers {opens}/{closes}')

              text = re.sub(
                  r'^import\s+\{\s*AppShell\s*\}\s+from\s+["\']@/components/layout/AppShell["\'];\s*\n',
                  '', text, count=1, flags=re.M,
              )
              text = text.replace('<AppShell>', '<>').replace('</AppShell>', '</>')
              if 'AppShell' in text:
                  raise SystemExit(f'{path}: AppShell token remained after fragment conversion')
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          if len(changed) < 10:
              raise SystemExit(f'expected many shell-owned pages, changed only {len(changed)}')
          leftovers = [str(p) for p in sorted(pages.glob('*.tsx')) if 'AppShell' in p.read_text(encoding='utf-8')]
          if leftovers:
              raise SystemExit('AppShell leftovers:\n' + '\n'.join(leftovers))
          print(f'Converted {len(changed)} pages to persistent-shell fragments')
          PY

      - name: Keep Realtime channel stable across token refreshes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/hooks/useRealtimeInvalidation.ts')
          text = path.read_text(encoding='utf-8')
          old_head = '''export function useRealtimeInvalidation() {\n  const { user } = useAuth();\n\n  useEffect(() => {\n    if (!user) return;\n    const userId = user.id;\n'''
          new_head = '''export function useRealtimeInvalidation() {\n  const { user } = useAuth();\n  const userId = user?.id ?? null;\n\n  useEffect(() => {\n    if (!userId) return;\n'''
          if text.count(old_head) != 1:
              raise SystemExit(f'Realtime owner block expected once, got {text.count(old_head)}')
          text = text.replace(old_head, new_head, 1)
          old_tail = '''  }, [user]);\n}\n'''
          new_tail = '''  }, [userId]);\n}\n'''
          if text.count(old_tail) != 1:
              raise SystemExit(f'Realtime dependency tail expected once, got {text.count(old_tail)}')
          text = text.replace(old_tail, new_tail, 1)
          text = text.replace(' * Plug uma vez no AppShell.', ' * Plug uma vez no boundary autenticado persistente.')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Make offline sync consume global auth ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/offline-queue.ts')
          text = path.read_text(encoding='utf-8')

          old_resolve = '''async function resolveCurrentUserId(): Promise<string | null> {\n  if (activeUserId) return activeUserId;\n  const { data, error } = await supabase.auth.getUser();\n  if (error || !data.user) return null;\n  activeUserId = data.user.id;\n  return activeUserId;\n}\n'''
          new_resolve = '''async function resolveCurrentUserId(): Promise<string | null> {\n  return activeUserId;\n}\n'''
          if text.count(old_resolve) != 1:
              raise SystemExit(f'offline user resolver expected once, got {text.count(old_resolve)}')
          text = text.replace(old_resolve, new_resolve, 1)

          old_setup = '''export function setupOfflineSync() {\n  if (setupDone) return;\n  setupDone = true;\n\n  void supabase.auth.getSession().then(async ({ data }) => {\n    activeUserId = data.session?.user?.id ?? null;\n    const network = await getNetworkStatus();\n    if (activeUserId && network.connected) {\n      setTimeout(() => void replayOfflineQueue(), 2000);\n    }\n  });\n\n  supabase.auth.onAuthStateChange((_event, session) => {\n    const previousUserId = activeUserId;\n    activeUserId = session?.user?.id ?? null;\n\n    if (activeUserId && activeUserId !== previousUserId) {\n      void getNetworkStatus().then((network) => {\n        if (network.connected) void replayOfflineQueue();\n      });\n    }\n  });\n\n  void subscribeNetworkStatus((network) => {\n    if (network.connected) void replayOfflineQueue();\n  }).then((cleanup) => {\n    networkCleanup = cleanup;\n  });\n}\n'''
          new_setup = '''export function setOfflineSyncUser(userId: string | null) {\n  const previousUserId = activeUserId;\n  activeUserId = userId;\n\n  if (activeUserId && activeUserId !== previousUserId) {\n    void getNetworkStatus().then((network) => {\n      if (network.connected) void replayOfflineQueue();\n    });\n  }\n}\n\nexport function setupOfflineSync() {\n  if (setupDone) return;\n  setupDone = true;\n\n  void subscribeNetworkStatus((network) => {\n    if (network.connected) void replayOfflineQueue();\n  }).then((cleanup) => {\n    networkCleanup = cleanup;\n  });\n}\n'''
          if text.count(old_setup) != 1:
              raise SystemExit(f'offline setup auth block expected once, got {text.count(old_setup)}')
          text = text.replace(old_setup, new_setup, 1)

          if 'supabase.auth.onAuthStateChange' in text or 'supabase.auth.getSession' in text or 'supabase.auth.getUser' in text:
              raise SystemExit('offline queue still owns Supabase auth state')
          path.write_text(text, encoding='utf-8')
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate lint report
        run: bunx eslint . --format json --output-file lint-report.json || true

      - name: Enforce lint debt budget
        run: bun scripts/check-lint-budget.mjs lint-report.json quality/lint-baseline.json

      - name: Run tests
        run: bun run test

      - name: Build
        run: |
          test -s .env
          grep -q '^VITE_SUPABASE_URL=' .env
          grep -q '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env
          bun run build

      - name: Commit validated architecture changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages src/hooks/useRealtimeInvalidation.ts src/lib/offline-queue.ts
          git diff --cached --check
          git commit -m "architecture: consolidate auth shell and Realtime runtime"
          git push origin HEAD:readify/p1-auth-runtime-01
