# Trigger v6: validate page-shell consolidation plus stable user-id Realtime ownership.
name: P1 consolidate page shells

on:
  push:
    branches:
      - readify/p1-auth-runtime-01
    paths:
      - .github/workflows/p1-consolidate-page-shells.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/p1-auth-runtime-01
          fetch-depth: 0

      - name: Remove page-owned AppShell wrappers with guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = Path('src/pages')
          changed = []
          for path in sorted(pages.glob('*.tsx')):
              text = path.read_text(encoding='utf-8')
              if 'AppShell' not in text:
                  continue

              import_matches = re.findall(r'^import\s+\{\s*AppShell\s*\}\s+from\s+["\']@/components/layout/AppShell["\'];\s*$', text, flags=re.M)
              if len(import_matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one canonical AppShell import, got {len(import_matches)}; aborting')

              opens = text.count('<AppShell>')
              closes = text.count('</AppShell>')
              if opens < 1 or opens != closes or opens > 6:
                  raise SystemExit(
                      f'{path}: unbalanced or suspicious AppShell wrappers: {opens} open/{closes} close; aborting'
                  )

              text = re.sub(
                  r'^import\s+\{\s*AppShell\s*\}\s+from\s+["\']@/components/layout/AppShell["\'];\s*\n',
                  '', text, count=1, flags=re.M,
              )
              text = text.replace('<AppShell>', '').replace('</AppShell>', '')

              if 'AppShell' in text:
                  raise SystemExit(f'{path}: AppShell token remained after canonical removal; aborting')

              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          if len(changed) < 10:
              raise SystemExit(f'expected many shell-owned pages, changed only {len(changed)}; aborting')

          leftovers = []
          for path in sorted(pages.glob('*.tsx')):
              if 'AppShell' in path.read_text(encoding='utf-8'):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('AppShell leftovers:\n' + '\n'.join(leftovers))

          print(f'Consolidated {len(changed)} pages:')
          print('\n'.join(changed))
          PY

      - name: Keep Realtime channel stable across token refreshes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hooks/useRealtimeInvalidation.ts')
          text = path.read_text(encoding='utf-8')

          old_head = '''export function useRealtimeInvalidation() {\n  const { user } = useAuth();\n\n  useEffect(() => {\n    if (!user) return;\n    const userId = user.id;\n'''
          new_head = '''export function useRealtimeInvalidation() {\n  const { user } = useAuth();\n  const userId = user?.id ?? null;\n\n  useEffect(() => {\n    if (!userId) return;\n'''
          if text.count(old_head) != 1:
              raise SystemExit(f'Realtime owner block expected once, got {text.count(old_head)}')
          text = text.replace(old_head, new_head, 1)

          old_tail = '''  }, [user]);\n}\n'''
          new_tail = '''  }, [userId]);\n}\n'''
          if text.count(old_tail) != 1:
              raise SystemExit(f'Realtime dependency tail expected once, got {text.count(old_tail)}')
          text = text.replace(old_tail, new_tail, 1)
          text = text.replace(' * Plug uma vez no AppShell.', ' * Plug uma vez no boundary autenticado persistente.')
          path.write_text(text, encoding='utf-8')
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate lint report and show warnings
        run: |
          bunx eslint . --format json --output-file lint-report.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('lint-report.json').read_text())
          warnings = []
          for item in data:
              for msg in item.get('messages', []):
                  if msg.get('severity') == 1:
                      warnings.append((item.get('filePath'), msg.get('line'), msg.get('column'), msg.get('ruleId'), msg.get('message')))
          print(f'Warnings: {len(warnings)}')
          for row in warnings:
              print(f'{row[0]}:{row[1]}:{row[2]} [{row[3]}] {row[4]}')
          PY

      - name: Enforce lint debt budget
        run: bun scripts/check-lint-budget.mjs lint-report.json quality/lint-baseline.json

      - name: Run tests
        run: bun run test

      - name: Build
        run: |
          test -s .env
          grep -q '^VITE_SUPABASE_URL=' .env
          grep -q '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env
          bun run build

      - name: Commit validated architecture changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages src/hooks/useRealtimeInvalidation.ts
          git diff --cached --check
          git commit -m "architecture: consolidate persistent shell and Realtime runtime"
          git push origin HEAD:readify/p1-auth-runtime-01
