name: P1 consolidate page shells

on:
  push:
    branches:
      - readify/p1-auth-runtime-01
    paths:
      - .github/workflows/p1-consolidate-page-shells.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/p1-auth-runtime-01
          fetch-depth: 0

      - name: Remove page-owned AppShell wrappers with guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = Path('src/pages')
          changed = []
          for path in sorted(pages.glob('*.tsx')):
              text = path.read_text(encoding='utf-8')
              if 'AppShell' not in text:
                  continue

              import_matches = re.findall(r'^import\s+\{\s*AppShell\s*\}\s+from\s+["\']@/components/layout/AppShell["\'];\s*$', text, flags=re.M)
              if not import_matches:
                  # AppShell in comments/other meaning is not safe for mechanical surgery.
                  raise SystemExit(f'{path}: contains AppShell but no canonical import; aborting')

              opens = len(re.findall(r'<AppShell>', text))
              closes = len(re.findall(r'</AppShell>', text))
              if len(import_matches) != 1 or opens != 1 or closes != 1:
                  raise SystemExit(
                      f'{path}: expected 1 import/1 open/1 close, got '
                      f'{len(import_matches)}/{opens}/{closes}; aborting'
                  )

              text = re.sub(
                  r'^import\s+\{\s*AppShell\s*\}\s+from\s+["\']@/components/layout/AppShell["\'];\s*\n',
                  '', text, count=1, flags=re.M,
              )
              text = re.sub(r'^\s*<AppShell>\s*\n', '', text, count=1, flags=re.M)
              text = re.sub(r'^\s*</AppShell>\s*\n?', '', text, count=1, flags=re.M)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          if len(changed) < 10:
              raise SystemExit(f'expected many shell-owned pages, changed only {len(changed)}; aborting')

          leftovers = []
          for path in sorted(pages.glob('*.tsx')):
              text = path.read_text(encoding='utf-8')
              if 'AppShell' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('AppShell leftovers:\n' + '\n'.join(leftovers))

          print(f'Consolidated {len(changed)} pages:')
          print('\n'.join(changed))
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce lint debt budget
        run: |
          bunx eslint . --format json --output-file lint-report.json || true
          bun scripts/check-lint-budget.mjs lint-report.json quality/lint-baseline.json

      - name: Run tests
        run: bun run test

      - name: Build
        run: |
          test -s .env
          grep -q '^VITE_SUPABASE_URL=' .env
          grep -q '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env
          bun run build

      - name: Commit consolidated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages
          git diff --cached --check
          git commit -m "architecture: remove page-owned AppShell wrappers"
          git push origin HEAD:readify/p1-auth-runtime-01
