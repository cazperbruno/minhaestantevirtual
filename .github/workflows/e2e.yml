name: E2E (Playwright)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin the runtime: "latest" can change underneath a release candidate.
          bun-version: 1.4.2

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright Test for E2E only
        # The legacy repository did not declare @playwright/test in bun.lock.
        # --no-save is an explicit Bun mode: install for this CI workspace only,
        # without mutating package.json or the committed lockfile.
        run: bun add --dev --no-save @playwright/test@1.63.0

      - name: Install Chromium browser
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Serve build
        run: bunx vite preview --port 5173 > /tmp/readify-vite-preview.log 2>&1 &
        env:
          PORT: 5173

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Readify preview did not become healthy"
          cat /tmp/readify-vite-preview.log || true
          exit 1

      - name: Run Playwright
        run: bunx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
