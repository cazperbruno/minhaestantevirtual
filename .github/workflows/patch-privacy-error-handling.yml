name: Patch privacy error handling

on:
  push:
    branches:
      - readify/reactivation-p0-integration-02
    paths:
      - .github/workflows/patch-privacy-error-handling.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/reactivation-p0-integration-02
          fetch-depth: 0

      - name: Apply guarded error-handling patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for label, old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path} / {label}: expected 1 match, got {count}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          patch('src/components/social/ProposeTradeDialog.tsx', [
            ('read errors',
             '''      const [{ data: mine }, { data: theirs }] = await Promise.all([\n        supabase\n          .from("user_books")\n          .select("id, book:books(*)")\n          .eq("user_id", user.id)\n          .eq("available_for_trade", true)\n          .limit(60),\n        supabase.rpc("visible_user_library" as any, {\n          _owner: receiverId,\n          _status: null,\n          _available_for_trade_only: true,\n          _limit: 60,\n        }),\n      ]);\n      setMyBooks((mine || []) as any);\n      setTheirBooks((theirs || []) as any);\n      setLoading(false);''',
             '''      try {\n        const [mineResult, theirsResult] = await Promise.all([\n          supabase\n            .from("user_books")\n            .select("id, book:books(*)")\n            .eq("user_id", user.id)\n            .eq("available_for_trade", true)\n            .limit(60),\n          supabase.rpc("visible_user_library" as any, {\n            _owner: receiverId,\n            _status: null,\n            _available_for_trade_only: true,\n            _limit: 60,\n          }),\n        ]);\n        if (mineResult.error) throw mineResult.error;\n        if (theirsResult.error) throw theirsResult.error;\n        setMyBooks((mineResult.data || []) as any);\n        setTheirBooks((theirsResult.data || []) as any);\n      } catch (error) {\n        console.error("[trade] failed to load available books", error);\n        setMyBooks([]);\n        setTheirBooks([]);\n        toast.error("Não foi possível carregar os livros disponíveis");\n      } finally {\n        setLoading(false);\n      }'''),
          ])

          patch('src/components/clubs/ClubBookProgress.tsx', [
            ('rpc error',
             '''      const { data: rows } = await supabase.rpc("club_book_progress", { _club_id: clubId });\n      if (!cancelled) {\n        setData((rows as ProgressRow[] | null)?.[0] ?? null);\n        setLoading(false);\n      }''',
             '''      const { data: rows, error } = await supabase.rpc("club_book_progress", { _club_id: clubId });\n      if (cancelled) return;\n      if (error) {\n        console.error("[club-progress] load failed", error);\n        setData(null);\n        setLoading(false);\n        return;\n      }\n      setData((rows as ProgressRow[] | null)?.[0] ?? null);\n      setLoading(false);'''),
          ])

          patch('src/pages/PublicProfile.tsx', [
            ('promise results',
             '''        const [{ data: lib }, { data: revs }, { count: followers }, { count: following }, { data: myFollow }] = await Promise.all([\n          supabase.rpc("visible_user_library" as any, {\n            _owner: p.id,\n            _status: null,\n            _available_for_trade_only: false,\n            _limit: 60,\n          }),\n          supabase\n            .from("reviews")\n            .select("*, book:books(id,title,authors,cover_url)")\n            .eq("user_id", p.id)\n            .eq("is_public", true)\n            .order("created_at", { ascending: false })\n            .limit(20),\n          supabase.from("follows").select("*", { count: "exact", head: true }).eq("following_id", p.id),\n          supabase.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", p.id),\n          user\n            ? supabase.from("follows").select("*").eq("follower_id", user.id).eq("following_id", p.id).maybeSingle()\n            : Promise.resolve({ data: null }),\n        ]);\n\n        if (cancelled) return;\n\n        const list = lib || [];''',
             '''        const [libraryResult, reviewsResult, followersResult, followingResult, myFollowResult] = await Promise.all([\n          supabase.rpc("visible_user_library" as any, {\n            _owner: p.id,\n            _status: null,\n            _available_for_trade_only: false,\n            _limit: 60,\n          }),\n          supabase\n            .from("reviews")\n            .select("*, book:books(id,title,authors,cover_url)")\n            .eq("user_id", p.id)\n            .eq("is_public", true)\n            .order("created_at", { ascending: false })\n            .limit(20),\n          supabase.from("follows").select("*", { count: "exact", head: true }).eq("following_id", p.id),\n          supabase.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", p.id),\n          user\n            ? supabase.from("follows").select("*").eq("follower_id", user.id).eq("following_id", p.id).maybeSingle()\n            : Promise.resolve({ data: null, error: null }),\n        ]);\n        if (libraryResult.error) throw libraryResult.error;\n        if (reviewsResult.error) throw reviewsResult.error;\n        if (followersResult.error) throw followersResult.error;\n        if (followingResult.error) throw followingResult.error;\n        if (myFollowResult.error) throw myFollowResult.error;\n\n        if (cancelled) return;\n\n        const lib = libraryResult.data;\n        const revs = reviewsResult.data;\n        const followers = followersResult.count;\n        const following = followingResult.count;\n        const myFollow = myFollowResult.data;\n        const list = lib || [];'''),
          ])

          patch('src/pages/PublicWishlistPage.tsx', [
            ('wrap async',
             '''    (async () => {\n      setLoading(true);\n      // 1) Perfil redigido conforme viewer (anônimo nesta rota pública).''',
             '''    (async () => {\n      setLoading(true);\n      setNotFound(false);\n      try {\n      // 1) Perfil redigido conforme viewer (anônimo nesta rota pública).'''),
            ('finish async',
             '''      setItems((ub as WishItem[]) || []);\n      setLoading(false);\n    })();''',
             '''      setItems((ub as WishItem[]) || []);\n      } catch (error) {\n        console.error("[wishlist] load failed", error);\n        if (!cancelled) {\n          setItems([]);\n          setNotFound(true);\n        }\n      } finally {\n        if (!cancelled) setLoading(false);\n      }\n    })();'''),
            ('stale comment',
             ''' * RLS já filtra: o RLS de `user_books` só retorna registros com is_public=true\n * e profile_visibility='public', então não precisamos validar visibilidade aqui.''',
             ''' * A página nunca lê `user_books` diretamente. Perfil e biblioteca passam por\n * RPCs redigidas que aplicam visibilidade e não expõem progresso oculto.'''),
          ])
          PY

      - name: Commit error handling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/social/ProposeTradeDialog.tsx src/components/clubs/ClubBookProgress.tsx src/pages/PublicProfile.tsx src/pages/PublicWishlistPage.tsx
          git diff --cached --check
          git commit -m "privacy: fail closed on redacted data read errors"
          git push origin HEAD:readify/reactivation-p0-integration-02
