name: Bootstrap Capacitor native dependencies

on:
  push:
    branches:
      - readify/reactivation-p0-integration-02
    paths:
      - .github/workflows/bootstrap-native-deps.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/reactivation-p0-integration-02
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install native runtime adapters and update lockfile
        run: |
          bun install --frozen-lockfile
          bun add \
            @capacitor/app@^8 \
            @capacitor/browser@^8 \
            @capacitor/camera@^8 \
            @capacitor/push-notifications@^8 \
            @capacitor/share@^8 \
            @capacitor/preferences@^8 \
            @capacitor/filesystem@^8 \
            @capacitor/network@^8 \
            @capacitor/haptics@^8 \
            @capacitor/status-bar@^8 \
            @capacitor/splash-screen@^8 \
            @capacitor/barcode-scanner@^3

      - name: Commit generated dependency lock state
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Native dependencies already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "mobile: add official Capacitor native adapters"
          git push origin HEAD:readify/reactivation-p0-integration-02
