name: Generate Readify native shells

on:
  push:
    branches:
      - readify/native-shells-01
    paths:
      - .github/workflows/native-shell-generation.yml

permissions:
  contents: write

jobs:
  android:
    name: Generate and build Android shell
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/native-shells-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Guard Android shell does not already exist
        run: test ! -d android

      - name: Add and sync Android
        run: |
          bunx cap add android
          bunx cap sync android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/variables.gradle

      - name: Align Android minimum SDK with barcode scanner
        run: |
          grep -q 'minSdkVersion = 24' android/variables.gradle
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/' android/variables.gradle
          grep -q 'minSdkVersion = 26' android/variables.gradle

      - name: Build unsigned/debug Android app
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Commit Android shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --check
          git commit -m "native: generate and validate Android Capacitor shell"
          git push origin HEAD:readify/native-shells-01

  ios:
    name: Generate and build iOS shell
    needs: android
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/native-shells-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify Xcode and install dependencies
        run: |
          xcodebuild -version
          node --version
          bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Guard iOS shell does not already exist
        run: test ! -d ios

      - name: Add and sync iOS with Swift Package Manager
        run: |
          bunx cap add ios
          bunx cap sync ios
          test -d ios/App/App.xcodeproj
          test -f ios/App/App/Info.plist

      - name: Build iOS simulator app without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit iOS shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git diff --cached --check
          git commit -m "native: generate and validate iOS Capacitor shell"
          git push origin HEAD:readify/native-shells-01
