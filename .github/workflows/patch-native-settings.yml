name: Patch native settings presentation

on:
  push:
    branches:
      - readify/reactivation-p0-integration-02
    paths:
      - .github/workflows/patch-native-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/reactivation-p0-integration-02
          fetch-depth: 0

      - name: Apply guarded settings patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/SettingsPage.tsx')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new, 1)

          replace_once(
            'import { ResetLibraryCard } from "@/components/settings/ResetLibraryCard";\n',
            'import { ResetLibraryCard } from "@/components/settings/ResetLibraryCard";\nimport { getRuntimePlatform, isNativePlatform } from "@/platform/runtime";\n',
            'runtime import'
          )

          replace_once(
            '  const [savingFlag, setSavingFlag] = useState<string | null>(null);\n',
            '  const [savingFlag, setSavingFlag] = useState<string | null>(null);\n  const nativeApp = isNativePlatform();\n  const runtimePlatform = getRuntimePlatform();\n',
            'runtime constants'
          )

          old = '''        {/* Instalação do App */}\n        <section className="mt-5 space-y-3">\n          <div className="flex items-center gap-2">\n            <Download className="w-4 h-4 text-primary" />\n            <h2 className="font-display text-lg font-semibold">Instalar aplicativo</h2>\n          </div>\n          <InstallAppCard />\n          <Button asChild variant="outline" size="sm" className="w-full">\n            <Link to="/instalar">Ver instruções completas</Link>\n          </Button>\n        </section>'''
          new = '''        {/* Instalação / runtime */}\n        {nativeApp ? (\n          <section className="mt-5 glass rounded-2xl p-5 space-y-2">\n            <div className="flex items-center gap-2">\n              <Download className="w-4 h-4 text-primary" />\n              <h2 className="font-display text-lg font-semibold">Aplicativo instalado</h2>\n            </div>\n            <p className="text-xs text-muted-foreground">\n              Você está usando o Readify para {runtimePlatform === "ios" ? "iPhone/iPad" : "Android"}.\n              Atualizações serão distribuídas pela {runtimePlatform === "ios" ? "App Store" : "Google Play"}.\n            </p>\n          </section>\n        ) : (\n          <section className="mt-5 space-y-3">\n            <div className="flex items-center gap-2">\n              <Download className="w-4 h-4 text-primary" />\n              <h2 className="font-display text-lg font-semibold">Instalar aplicativo</h2>\n            </div>\n            <InstallAppCard />\n            <Button asChild variant="outline" size="sm" className="w-full">\n              <Link to="/instalar">Ver instruções completas</Link>\n            </Button>\n          </section>\n        )}'''
          replace_once(old, new, 'install section')

          p.write_text(s)
          PY

      - name: Commit settings patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SettingsPage.tsx
          git diff --cached --check
          git commit -m "mobile: make settings aware of installed native runtime"
          git push origin HEAD:readify/reactivation-p0-integration-02
