name: Patch Realtime profile payload

on:
  push:
    branches:
      - readify/reactivation-p0-integration-02
    paths:
      - .github/workflows/patch-realtime-profile-payload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/reactivation-p0-integration-02
          fetch-depth: 0

      - name: Restrict Realtime profile payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hook = Path('src/hooks/useRealtimeInvalidation.ts')
          text = hook.read_text(encoding='utf-8')
          old = '''      .on(\n        "postgres_changes",\n        { event: "*", schema: "public", table: "profiles" },\n        (payload: any) => {'''
          new = '''      .on(\n        "postgres_changes",\n        { event: "*", schema: "public", table: "profiles", select: ["id"] },\n        (payload: any) => {'''
          if text.count(old) != 1:
              raise SystemExit(f'profile Realtime subscription expected once, got {text.count(old)}')
          hook.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('src/test/profile-column-boundaries.test.ts')
          text = test.read_text(encoding='utf-8')
          anchor = '''  it("profile prefetch requests only public identity columns", () => {'''
          addition = '''  it("Realtime profile invalidation requests only the primary key", () => {\n    const content = source("src/hooks/useRealtimeInvalidation.ts");\n    expect(content).toContain('table: "profiles", select: ["id"]');\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('profile boundary test anchor not found exactly once')
          test.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useRealtimeInvalidation.ts src/test/profile-column-boundaries.test.ts
          git diff --cached --check
          git commit -m "privacy: restrict Realtime profile payload to id"
          git push origin HEAD:readify/reactivation-p0-integration-02
