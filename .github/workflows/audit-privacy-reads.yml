name: Audit cross-user privacy reads

on:
  push:
    branches:
      - readify/reactivation-p0-integration-02
    paths:
      - .github/workflows/audit-privacy-reads.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readify/reactivation-p0-integration-02
          fetch-depth: 0

      - name: Generate privacy read report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scans = [
              (
                  "client user_books references",
                  Path("src"),
                  {".ts", ".tsx"},
                  re.compile(r"user_books"),
              ),
              (
                  "client privacy/progress references",
                  Path("src"),
                  {".ts", ".tsx"},
                  re.compile(r"profile_visibility|library_visibility|show_progress|current_page"),
              ),
              (
                  "SQL privacy-sensitive routines and policies",
                  Path("supabase/migrations"),
                  {".sql"},
                  re.compile(
                      r"books_read_by_following|club_book_progress|profiles_select_all|"
                      r"ub_select_public_or_own|profile_visibility|library_visibility|current_page"
                  ),
              ),
          ]

          sections = []
          total_matches = 0
          for title, root, suffixes, pattern in scans:
              files = sorted(
                  p for p in root.rglob("*")
                  if p.suffix in suffixes and p.is_file()
              )
              lines_out = [f"# {title}"]
              matches = 0
              for path in files:
                  lines = path.read_text(encoding="utf-8").splitlines()
                  hit_lines = [i for i, line in enumerate(lines) if pattern.search(line)]
                  if not hit_lines:
                      continue
                  matches += len(hit_lines)
                  lines_out.append(f"\n## {path}")
                  emitted = set()
                  for idx in hit_lines:
                      start = max(0, idx - 5)
                      end = min(len(lines), idx + 10)
                      for line_no in range(start, end):
                          key = (path, line_no)
                          if key in emitted:
                              continue
                          emitted.add(key)
                          marker = ">" if line_no == idx else " "
                          lines_out.append(f"{marker}{line_no + 1:5}: {lines[line_no]}")
              total_matches += matches
              lines_out.insert(1, f"matches: {matches}")
              sections.append("\n".join(lines_out))

          if total_matches == 0:
              raise SystemExit("privacy audit produced zero matches; refusing false-green report")

          Path("docs/.privacy-read-audit.tmp").write_text(
              "\n\n".join(sections) + "\n", encoding="utf-8"
          )
          print(f"privacy audit matches: {total_matches}")
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.privacy-read-audit.tmp
          if git diff --cached --quiet; then
            echo "Privacy audit report unchanged"
            exit 0
          fi
          git commit -m "audit: include privacy-sensitive SQL routines"
          git push origin HEAD:readify/reactivation-p0-integration-02
